[project]
name = "new-vae-bundle"
version = "0.1.0"
description = "Variational Autoencoder research toolkit: standard VAE, IWAE, VampPrior, ExemplarVAE, and hierarchical variants with clustering analysis and log-likelihood estimation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "hdbscan>=0.8.42",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "tqdm>=4.60.0",
    "umap-learn>=0.5.11",
    "wget>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["unit_tests"]
markers = [
    "slow: marks tests as slow (run with --run-slow)",
]
